<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="referrer" content="no-referrer">
<title>BSB Travel</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BSB Travel">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c0e24">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/logo-180.png">
<link rel="icon" href="icons/logo-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<script>
  // Theme before first paint, so the app never flashes the wrong colours.
  try { var t = new URLSearchParams(location.search).get('theme') || localStorage.getItem('bsb.theme') || 'night';
    document.documentElement.dataset.theme = t;
    document.querySelector('meta[name="theme-color"]').content = { night: '#0c0e24', temple: '#f3f1ed', andaman: '#05242b', jungle: '#0b1f14' }[t] || '#0c0e24'; } catch (e) {}
</script>
<div id="sentinel"></div>
<div id="navbar"><b id="navtitle"></b><button id="syncdot" aria-label="Sync status"></button></div>
<header id="top"><div class="eyebrow"><img src="icons/logo-180.png" alt="">BSB TRAVEL</div><h1 id="title"></h1></header>
<main id="view"></main>
<div id="tabfade"></div>
<nav id="tabs" class="chrome">
  <i class="pill"></i>
  <button data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>Today</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M8 3v4M16 3v4"/></svg>Plan</button>
  <button data-tab="convert"><svg viewBox="0 0 24 24"><path d="M4 9h14l-3.5-3.5M20 15H6l3.5 3.5"/></svg>Convert</button>
  <button data-tab="translate"><svg viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-8l-5 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/><path d="M8 9.5h8M8 12.5h5"/></svg>Translate</button>
  <button data-tab="more"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg>More</button>
</nav>
<div id="sheet" hidden></div>
<div id="driver" hidden></div>
<div id="toast" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
